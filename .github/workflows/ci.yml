# prompiler — CI
#
# Required status checks per docs/PLAN.md §P0 (branch protection on `main`):
#   - pre-commit
#   - unit
#   - integration
#   - e2e
#
# Test tiers mirror docs/MANUAL_TESTING.md §§2–4. The integration job boots an
# Ollama sidecar service container and pulls a small structured-output capable
# model so backend adapter tests can hit a real wire. The e2e job still treats
# pytest's exit code 5 ("no tests collected") as success until later phases
# populate the e2e marker.
#
# The `perf` job asserts the hermetic PRD §7.1 budgets (compile, validate). It is
# deliberately NOT a required check: timing on shared runners jitters, and the
# best-of-N(min) strategy keeps it stable enough to surface regressions without
# gating merges on a preempted sample.
name: CI

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.4.30"

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          ignore-nothing-to-cache: true

      - name: Install Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run pre-commit hooks (pre-commit stage only)
        run: uvx pre-commit run --all-files --show-diff-on-failure --color always

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          ignore-nothing-to-cache: true

      - name: Install Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run unit tier
        run: uv run pytest -m unit --cov=prompiler --cov-report=term-missing --cov-fail-under=80 -q

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      ollama:
        image: ollama/ollama:0.5.4
        ports:
          - 11434:11434
    env:
      OLLAMA_INTEGRATION_BASE_URL: http://localhost:11434
      OLLAMA_INTEGRATION_MODEL: llama3.2:1b
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          ignore-nothing-to-cache: true

      - name: Install Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Wait for Ollama sidecar to accept HTTP
        # The ollama/ollama image has no curl, so we probe from the runner via
        # the published port mapping. Bail out after ~60s if the daemon never
        # comes up — a stuck sidecar is a CI failure, not a silent skip.
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --fail --max-time 2 "${OLLAMA_INTEGRATION_BASE_URL}/api/tags" >/dev/null; then
              echo "Ollama ready after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Ollama sidecar never became reachable at ${OLLAMA_INTEGRATION_BASE_URL}." >&2
          exit 1

      - name: Pull integration model (${{ env.OLLAMA_INTEGRATION_MODEL }})
        # /api/pull streams progress when stream=true; we want a single blocking
        # call so the next step can assume the model is resident.
        run: |
          curl --fail --show-error --silent \
            -X POST "${OLLAMA_INTEGRATION_BASE_URL}/api/pull" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"${OLLAMA_INTEGRATION_MODEL}\",\"stream\":false}"

      - name: Run integration tier
        run: uv run pytest -m integration -q

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          ignore-nothing-to-cache: true

      - name: Install Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run e2e tier
        run: |
          set +e
          uv run pytest -m e2e -q
          code=$?
          set -e
          if [ "$code" = "5" ]; then
            echo "::notice::No e2e tests collected — P0 skeleton stage."
            exit 0
          fi
          exit "$code"

  perf:
    name: perf
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          ignore-nothing-to-cache: true

      - name: Install Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run perf tier (PRD §7.1 hermetic budgets)
        run: uv run pytest -m perf -q
