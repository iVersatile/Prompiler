[project]
name = "prompiler"
version = "0.2.0"
description = "Spec-to-artefact prompt compiler with multi-vendor adapters and MCP server."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "prompiler contributors" }]
keywords = ["prompt", "compiler", "llm", "mcp", "anthropic", "openai", "gemini", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "jinja2>=3.1",
    "httpx>=0.27",
    "mcp>=1.2,<2",
    "typer>=0.12",
]

[project.optional-dependencies]
adc = ["google-auth>=2.0"]
keychain = ["keyring>=24"]
telemetry = ["opentelemetry-api>=1.27", "opentelemetry-sdk>=1.27"]

[project.scripts]
prompiler = "prompiler.cli:main"

[project.urls]
Homepage = "https://github.com/iVersatile/Prompiler"
Repository = "https://github.com/iVersatile/Prompiler"
Issues = "https://github.com/iVersatile/Prompiler/issues"

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pre-commit>=3.5.0",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.23",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompiler"]

# Ship the repo-root example specs as package data so a wheel install is
# self-contained: the MCP server resolves them via importlib.resources from
# ``prompiler/examples/`` (see ``_resolve_examples_dir``). hatchling's
# force-include keys cannot glob, so every ``examples/*.yaml`` is listed
# explicitly; ``test_every_example_spec_is_force_included_in_wheel`` guards
# against a new spec being added without a matching entry (LL-012).
[tool.hatch.build.targets.wheel.force-include]
"examples/citation.yaml" = "prompiler/examples/citation.yaml"
"examples/contract_obligation.yaml" = "prompiler/examples/contract_obligation.yaml"
"examples/email_category.yaml" = "prompiler/examples/email_category.yaml"
"examples/incident_event.yaml" = "prompiler/examples/incident_event.yaml"
"examples/invoice.yaml" = "prompiler/examples/invoice.yaml"
"examples/medical_letter.yaml" = "prompiler/examples/medical_letter.yaml"
"examples/purchase_order.yaml" = "prompiler/examples/purchase_order.yaml"
"examples/receipt.yaml" = "prompiler/examples/receipt.yaml"
"examples/support_ticket.yaml" = "prompiler/examples/support_ticket.yaml"

[tool.hatch.build.targets.sdist]
include = ["src/prompiler", "README.md", "LICENSE", "NOTICE"]

# -----------------------------------------------------------------------------
# Ruff — lint + format. Gated in pre-commit (§2) on src/ and tests/.
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
"src/prompiler/compiler/prompt_synth.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# -----------------------------------------------------------------------------
# mypy — strict. Gated in pre-commit (§2) on src/prompiler.
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
files = ["src/prompiler"]

# -----------------------------------------------------------------------------
# pytest — unit/integration/e2e markers per docs/MANUAL_TESTING.md §2.
# Pre-commit gate runs `-m unit` with cov >=80%; integration/e2e run in CI.
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: fast, hermetic unit tests (gate at commit time)",
    "integration: cross-component tests (CI only)",
    "e2e: end-to-end CLI/MCP tests (CI only)",
    "perf: PRD §7.1 performance-budget assertions (dedicated CI job)",
    "live_smoke: nightly checks against real vendor APIs (workflow only)",
]

# -----------------------------------------------------------------------------
# coverage.py — used by pytest-cov in the §2 pre-commit gate.
# -----------------------------------------------------------------------------
[tool.coverage.run]
source = ["prompiler"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.$",
]
show_missing = true
skip_covered = false
