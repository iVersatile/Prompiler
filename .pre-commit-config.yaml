# Pre-commit configuration for prompiler.
#
# Source of truth: docs/RULES.md §2 (pre-commit gate) and §3 (pre-push gate).
# Do not let this file diverge from RULES.md without updating RULES.md in the
# same commit.
#
# Install:
#   uv run pre-commit install
#   uv run pre-commit install --hook-type pre-push
#   uv run pre-commit install --hook-type commit-msg
#   uv run pre-commit install --hook-type prepare-commit-msg
#
# Manual sweep:
#   uv run pre-commit run --all-files

default_language_version:
  python: python3.11

default_stages: [pre-commit]

repos:
  # ---------------------------------------------------------------------------
  # §1.0 Feature-branch precondition — refuse to commit on main/master unless
  # ALLOW_MAIN_COMMIT=1 is set. Runs first so a wrong-branch commit fails fast
  # before the heavier ruff/mypy/pytest gates burn CPU.
  # ---------------------------------------------------------------------------

  - repo: local
    hooks:
      - id: branch-guard
        name: branch guard (block main/master unless ALLOW_MAIN_COMMIT=1)
        entry: python3 scripts/check_branch_guard.py
        language: system
        pass_filenames: false

  # ---------------------------------------------------------------------------
  # §2 Pre-commit gate — must pass before any commit lands.
  # ---------------------------------------------------------------------------

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (lint)
        entry: uv run ruff check src/ tests/
        language: system
        pass_filenames: false

      - id: ruff-format-check
        name: ruff format --check
        entry: uv run ruff format --check src/ tests/
        language: system
        pass_filenames: false

      - id: mypy
        name: mypy src/prompiler
        entry: uv run mypy src/prompiler
        language: system
        pass_filenames: false

      - id: pytest-unit
        name: pytest (unit tier, coverage >= 80%)
        entry: uv run pytest tests/ -m unit --cov=prompiler --cov-fail-under=80 -q
        language: system
        pass_filenames: false

      - id: prompiler-validate
        name: "prompiler validate prompts/ (P0 stub: existence check)"
        entry: uv run prompiler validate prompts/
        language: system
        pass_filenames: false

  # ---------------------------------------------------------------------------
  # §8 Secret scanning — runs on every commit AND on push (with --diff range).
  # ---------------------------------------------------------------------------

  - repo: local
    hooks:
      - id: scan-secrets-staged
        name: scan secrets (staged changes)
        entry: python3 scripts/scan_secrets.py --staged
        language: system
        pass_filenames: false

      - id: scan-secrets-push
        name: scan secrets (push range)
        entry: python3 scripts/scan_secrets.py --pre-push
        language: system
        pass_filenames: false
        stages: [pre-push]

  # ---------------------------------------------------------------------------
  # §3 Pre-push gate — clean working tree only. Pytest is NOT re-run; §2
  # already proved tests green at commit time.
  # ---------------------------------------------------------------------------

  - repo: local
    hooks:
      - id: working-tree-clean
        name: working tree clean (no uncommitted changes)
        entry: python3 scripts/check_clean_tree.py
        language: system
        pass_filenames: false
        stages: [pre-push]

  # ---------------------------------------------------------------------------
  # §4 LESSONS_LEARNT citation gate — fires on `fix:` / `perf:` commit subjects.
  # Reads the staged commit message; passes for non-fix/perf subjects.
  # ---------------------------------------------------------------------------

  - repo: local
    hooks:
      - id: lesson-cite
        name: lesson citation check (fix:/perf:)
        entry: python3 scripts/check_lesson_cite.py
        language: system
        pass_filenames: true
        stages: [commit-msg]

  # ---------------------------------------------------------------------------
  # §4 Docs-only Lesson-skip hint — fires on prepare-commit-msg stage.
  # Appends a hint block when the staged diff touches only *.md files,
  # pointing the user at the bare `Lesson-skip:` trailer that
  # `check_lesson_cite.py` accepts for docs-only scopes.
  # ---------------------------------------------------------------------------

  - repo: local
    hooks:
      - id: prepare-commit-msg-docs-hint
        name: prepare-commit-msg (docs-only Lesson-skip hint)
        entry: python3 scripts/prepare_commit_msg.py
        language: system
        pass_filenames: true
        stages: [prepare-commit-msg]
